# Serves the Unity WebGL build and passes the twins' WebSocket connections on
# to the bridges container. The page and its WebSockets share one origin, so
# the bridge ports never need to be published on the host.

# WebSocket upgrade: forward the client's Upgrade header and set Connection to
# match, which nginx doesn't do on its own
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Resolving "bridges" per request (via the variable
    # below) rather than once at startup means nginx starts even if the bridges
    # container isn't up yet, and follows it if it restarts with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $bridges bridges;

    # Make browsers re-check files on each load (cheap on a LAN), so a new
    # Unity build shows up without a hard refresh. Unity's build file names
    # don't change between builds.
    add_header Cache-Control "no-cache" always;

    # --- Twin WebSockets (BridgeConnection.WebSocketPath in Unity) ---
    location = /ws/robot {
        proxy_pass http://$bridges:8765/;
        include /etc/nginx/conf.d/websocket.inc;
    }

    location = /ws/imu {
        proxy_pass http://$bridges:8766/;
        include /etc/nginx/conf.d/websocket.inc;
    }

    # --- Unity WebGL build, gzip-compressed by Unity at build time ---
    # Sent as stored, labelled as gzip so the browser decompresses them.
    # (Brotli would be smaller, but browsers only accept it over https.)
    # types {} clears the extension-based type so default_type applies.
    location ~ \.wasm\.gz$ {
        gzip off;
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache" always;
    }

    location ~ \.js\.gz$ {
        gzip off;
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache" always;
    }

    location ~ \.(data|symbols\.json)\.gz$ {
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
